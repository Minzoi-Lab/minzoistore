```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minzoi Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0f;
            color: #ffffff;
        }

        header {
            padding: 30px 40px;
            border-bottom: 1px solid #242429;
            background: #111114;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 7px 0 0;
            color: #9999a3;
        }

        #store {
            padding: 35px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            max-width: 1400px;
            margin: auto;
        }

        .app {
            background: #151519;
            border: 1px solid #27272e;
            border-radius: 14px;
            padding: 20px;
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .app:hover {
            transform: translateY(-3px);
            border-color: #3b3b45;
            background: #18181d;
        }

        .icon-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }

        .icon {
            max-width: 160px;
            max-height: 160px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 16px;
        }

        .app h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .description {
            color: #a5a5ae;
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
        }

        .button {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 11px 15px;
            border-radius: 9px;
            border: none;
            background: #ffffff;
            color: #111111;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .button:hover {
            background: #dddddd;
        }

        .github {
            background: #24242b;
            color: #ffffff;
        }

        .github:hover {
            background: #303039;
        }

        .error {
            grid-column: 1 / -1;
            padding: 20px;
            background: #191419;
            border: 1px solid #392c39;
            border-radius: 10px;
            color: #d6b9d6;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            color: #888891;
            padding: 50px;
        }
    </style>
</head>

<body>

<header>
    <h1>Minzoi Store</h1>
    <p>Apps and tools made for Minzoi.</p>
</header>

<main id="store">
    <div class="loading">Loading apps...</div>
</main>

<script>
    const store = document.getElementById("store");

    async function loadStore() {
        try {
            const response = await fetch("configs.json");

            if (!response.ok) {
                throw new Error("Could not load configs.json");
            }

            const configFiles = await response.json();

            store.innerHTML = "";

            for (const configFile of configFiles) {
                try {
                    const configResponse = await fetch(configFile);

                    if (!configResponse.ok) {
                        throw new Error("Could not load " + configFile);
                    }

                    const app = await configResponse.json();

                    createApp(app);
                } catch (error) {
                    console.error(error);
                }
            }

            if (store.children.length === 0) {
                store.innerHTML = '<div class="error">No apps were found.</div>';
            }
        } catch (error) {
            console.error(error);

            store.innerHTML = `
                <div class="error">
                    Could not load the store configuration.
                </div>
            `;
        }
    }

    function createApp(app) {
        const card = document.createElement("div");
        card.className = "app";

        const iconContainer = document.createElement("div");
        iconContainer.className = "icon-container";

        const icon = document.createElement("img");
        icon.className = "icon";
        icon.src = app.icon;
        icon.alt = app.name + " icon";

        icon.onerror = function() {
            icon.style.display = "none";
        };

        iconContainer.appendChild(icon);

        const title = document.createElement("h2");
        title.textContent = app.name;

        const description = document.createElement("div");
        description.className = "description";
        description.textContent = app.description;

        card.appendChild(iconContainer);
        card.appendChild(title);
        card.appendChild(description);

        if (app.downloadable === true) {
            const download = document.createElement("a");

            download.className = "button";
            download.textContent = "Download";
            download.href = app.file;
            download.download = "";

            card.appendChild(download);
        } else if (app.githuburl) {
            const github = document.createElement("a");

            github.className = "button github";
            github.textContent = "GitHub";
            github.href = app.githuburl;
            github.target = "_blank";
            github.rel = "noopener noreferrer";

            card.appendChild(github);
        }

        store.appendChild(card);
    }

    loadStore();
</script>

</body>
</html>
