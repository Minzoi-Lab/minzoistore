<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minzoi Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            min-height: 100vh;
        }
        
        header {
            text-align: center;
            padding: 40px 20px 30px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0 0 22px;
            color: #999;
        }

        #search {
            width: min(500px, 90%);
            padding: 13px 16px;

            border: 1px solid #333;
            border-radius: 10px;

            background: #181818;
            color: white;

            font-size: 16px;
            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #search:focus {
            border-color: #666;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        #search::placeholder {
            color: #666;
        }

        #store {
            max-width: 1100px;
            margin: auto;
            padding: 20px;

            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(130px, 1fr));

            gap: 25px;
        }

        .app {
            appearance: none;

            background: transparent;
            border: 0;

            padding: 10px;

            text-align: center;

            cursor: pointer;

            user-select: none;

            border-radius: 14px;

            color: white;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .app:hover {
            transform: translateY(-4px);
            background: #181818;
        }

        .app:active {
            transform: scale(0.96);
        }

        .app:focus-visible {
            outline: 2px solid #777;
            outline-offset: 3px;
        }

        .icon-container {
            width: 90px;
            height: 90px;

            margin: 0 auto 10px;
        }

        .icon {
            width: 100%;
            height: 100%;

            object-fit: contain;

            border-radius: 18px;

            display: block;

            background: #181818;
        }

        .app h2 {
            margin: 0;

            font-size: 15px;
            font-weight: 600;

            color: white;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .error,
        .loading,
        .no-results {
            grid-column: 1 / -1;

            text-align: center;

            color: #888;

            padding: 40px 20px;
        }

        #overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 90;
        }

        #overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        #app-panel {
            position: fixed;

            top: 0;
            right: 0;

            width: min(420px, 90vw);
            height: 100vh;

            background: #151515;

            border-left: 1px solid #292929;

            padding: 30px;

            z-index: 100;

            overflow-y: auto;

            transform: translateX(100%);

            transition:
                transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #app-panel.active {
            transform: translateX(0);
        }

        #close-panel {
            position: absolute;

            top: 18px;
            right: 18px;

            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 10px;

            background: #242424;
            color: white;

            font-size: 22px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        #close-panel:hover {
            background: #303030;
        }

        #close-panel:active {
            transform: scale(0.9);
        }

        .panel-icon {
            width: 120px;
            height: 120px;

            object-fit: contain;

            border-radius: 24px;

            display: block;

            margin: 20px auto 25px;

            background: #181818;
        }

        #panel-name {
            margin: 0;

            text-align: center;

            font-size: 28px;
        }

        #panel-description {
            margin: 15px 0 30px;

            color: #aaa;

            line-height: 1.6;

            text-align: center;

            white-space: pre-line;
        }

        #panel-button {
            display: block;

            width: 100%;

            padding: 14px 18px;

            border-radius: 10px;

            background: white;
            color: black;

            text-align: center;

            text-decoration: none;

            font-weight: bold;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        #panel-button:hover {
            opacity: 0.9;
        }

        #panel-button:active {
            transform: scale(0.97);
        }

        #panel-button[hidden] {
            display: none;
        }

        @media (max-width: 600px) {

            header {
                padding-top: 30px;
            }

            header h1 {
                font-size: 28px;
            }

            #store {
                grid-template-columns:
                    repeat(auto-fill, minmax(100px, 1fr));

                gap: 18px;

                padding: 15px;
            }

            .icon-container {
                width: 72px;
                height: 72px;

                margin-bottom: 8px;
            }

            .app h2 {
                font-size: 14px;
            }


            #app-panel {
                top: auto;
                bottom: 0;

                left: 0;
                right: 0;

                width: 100%;
                height: auto;

                max-height: 85vh;

                border-left: 0;
                border-top: 1px solid #292929;

                border-radius: 20px 20px 0 0;

                padding:
                    25px
                    25px
                    calc(25px + env(safe-area-inset-bottom));

                transform: translateY(100%);
            }

            #app-panel.active {
                transform: translateY(0);
            }

            .panel-icon {
                width: 100px;
                height: 100px;

                margin-top: 10px;
            }

            #panel-name {
                font-size: 24px;
            }

            #panel-description {
                font-size: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Minzoi Store</h1>

        <p>
            Apps and tools made for Minzoi.
        </p>

        <input
            id="search"
            type="search"
            placeholder="Search apps..."
            autocomplete="off"
        >

    </header>


    <main id="store">

        <div class="loading">
            Loading apps...
        </div>

    </main>


    <div id="overlay"></div>



    <aside
        id="app-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="panel-name"
    >

        <button
            id="close-panel"
            aria-label="Close"
        >
            ×
        </button>

        <img
            id="panel-icon"
            class="panel-icon"
            src=""
            alt=""
        >

        <h2 id="panel-name"></h2>

        <p id="panel-description"></p>

        <a
            id="panel-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        ></a>

    </aside>


    <script>

        const DISCORD_SERVER_ID =
            "1495108660467204166";
        
        const DISCORD_FALLBACK_ICON =
            `https://discord.com/api/guilds/${DISCORD_SERVER_ID}/widget.png?style=banner1`;


        const DISCORD_FINAL_FALLBACK =
            "https://cdn.discordapp.com/embed/avatars/0.png";

        const store =
            document.getElementById("store");

        const search =
            document.getElementById("search");

        const overlay =
            document.getElementById("overlay");

        const panel =
            document.getElementById("app-panel");

        const closePanel =
            document.getElementById("close-panel");

        const panelIcon =
            document.getElementById("panel-icon");

        const panelName =
            document.getElementById("panel-name");

        const panelDescription =
            document.getElementById(
                "panel-description"
            );

        const panelButton =
            document.getElementById(
                "panel-button"
            );


        let apps = [];

        let previouslyFocusedElement = null;

        function setIconWithFallback(
            image,
            iconUrl,
            altText
        ) {

            image.alt = altText || "";

            image.dataset.fallbackLevel = "0";

            image.src =
                iconUrl || DISCORD_FALLBACK_ICON;


            image.onerror = () => {

                const level =
                    Number(
                        image.dataset.fallbackLevel || "0"
                    );
                

                if (level === 0) {

                    image.dataset.fallbackLevel = "1";

                    image.src =
                        DISCORD_FALLBACK_ICON;

                    return;

                }


                if (level === 1) {

                    image.dataset.fallbackLevel = "2";

                    image.src =
                        DISCORD_FINAL_FALLBACK;

                    return;

                }


                image.onerror = null;

                image.style.objectFit = "contain";

                image.src =
                    "data:image/svg+xml," +
                    encodeURIComponent(`
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="256"
                            height="256"
                            viewBox="0 0 256 256"
                        >
                            <rect
                                width="256"
                                height="256"
                                rx="48"
                                fill="#181818"
                            />
                            <text
                                x="128"
                                y="145"
                                text-anchor="middle"
                                font-size="100"
                                fill="#777"
                            >?</text>
                        </svg>
                    `);

            };

        }

        async function loadStore() {

            try {

                const response =
                    await fetch(
                        "configs.json?v=" +
                        Date.now(),
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load configs.json"
                    );

                }


                const configFiles =
                    await response.json();


                if (!Array.isArray(configFiles)) {

                    throw new Error(
                        "configs.json must contain an array"
                    );

                }


                apps = [];


                for (
                    const configFile
                    of configFiles
                ) {

                    try {


                        const configResponse =
                            await fetch(
                                configFile +
                                (
                                    configFile.includes("?")
                                        ? "&"
                                        : "?"
                                ) +
                                "v=" +
                                Date.now(),
                                {
                                    cache: "no-store"
                                }
                            );


                        if (!configResponse.ok) {

                            throw new Error(
                                "Could not load " +
                                configFile
                            );

                        }


                        const app =
                            await configResponse.json();

                        if (
                            !app ||
                            typeof app !== "object"
                        ) {

                            throw new Error(
                                "Invalid app config: " +
                                configFile
                            );

                        }


                        if (!app.name) {

                            console.warn(
                                "App config has no name:",
                                configFile
                            );

                            continue;

                        }


                        apps.push(app);

                    } catch (error) {

                        console.error(
                            "Failed to load app config:",
                            configFile,
                            error
                        );

                    }

                }


                renderApps();


            } catch (error) {

                console.error(error);


                store.innerHTML =
                    '<div class="error">' +
                    'Could not load the store configuration.' +
                    '</div>';

            }

        }


        function renderApps() {

            const query =
                search.value
                    .trim()
                    .toLowerCase();

            const filteredApps =
                apps.filter(app => {

                    const name =
                        (app.name || "")
                            .toLowerCase();

                    return name.includes(query);

                });


            store.innerHTML = "";


            if (
                filteredApps.length === 0
            ) {

                const result =
                    document.createElement("div");

                result.className =
                    "no-results";


                result.textContent =
                    query
                        ? `No apps found for "${search.value}".`
                        : "No apps were found.";


                store.appendChild(result);

                return;

            }


            filteredApps.forEach(
                createApp
            );

        }

        function createApp(app) {

            const card =
                document.createElement("button");

            card.type = "button";

            card.className = "app";


            const iconContainer =
                document.createElement("div");

            iconContainer.className =
                "icon-container";


            const icon =
                document.createElement("img");

            icon.className = "icon";


            setIconWithFallback(
                icon,
                app.icon,
                `${app.name} icon`
            );


            iconContainer.appendChild(icon);


            const title =
                document.createElement("h2");

            title.textContent =
                app.name;


            card.appendChild(
                iconContainer
            );

            card.appendChild(title);


            card.addEventListener(
                "click",
                () => openPanel(app, card)
            );


            store.appendChild(card);

        }

        function openPanel(
            app,
            sourceElement
        ) {

            previouslyFocusedElement =
                sourceElement || document.activeElement;


            setIconWithFallback(
                panelIcon,
                app.icon,
                `${app.name || "App"} icon`
            );


            panelName.textContent =
                app.name || "";

            if (
                app.name === "Hash++"
            ) {

                panelDescription.textContent =
                    "The HashHashPlus interface, supports:\n" +
                    "Terminal Use\n" +
                    "Built-in UI\n" +
                    "IDE coming soon.";

            } else {

                panelDescription.textContent =
                    app.description || "";

            }

            panelButton.hidden = true;

            panelButton.textContent = "";

            panelButton.removeAttribute(
                "href"
            );

            panelButton.removeAttribute(
                "target"
            );

            if (
                app.downloadable === true &&
                app.file
            ) {

                panelButton.textContent =
                    "Download";

                panelButton.href =
                    app.file;

                panelButton.setAttribute(
                    "download",
                    ""
                );

                panelButton.hidden =
                    false;

            }

            else if (
                app.githuburl
            ) {

                panelButton.textContent =
                    "GitHub";

                panelButton.href =
                    app.githuburl;

                panelButton.target =
                    "_blank";

                panelButton.rel =
                    "noopener noreferrer";

                panelButton.hidden =
                    false;

            }


            overlay.classList.add(
                "active"
            );

            panel.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";


            closePanel.focus();

        }

        function closeAppPanel() {

            overlay.classList.remove(
                "active"
            );

            panel.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";


            if (
                previouslyFocusedElement &&
                document.body.contains(
                    previouslyFocusedElement
                )
            ) {

                previouslyFocusedElement.focus();

            }

        }

        closePanel.addEventListener(
            "click",
            closeAppPanel
        );


        overlay.addEventListener(
            "click",
            closeAppPanel
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape" &&
                    panel.classList.contains(
                        "active"
                    )
                ) {

                    closeAppPanel();

                }

            }
        );


        search.addEventListener(
            "input",
            renderApps
        );

        loadStore();

    </script>

</body>
</html>
