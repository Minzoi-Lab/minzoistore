<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minzoi Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0 0 20px;
            color: #aaa;
        }

        #search {
            width: min(500px, 90%);
            box-sizing: border-box;
            padding: 13px 16px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #181818;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #search:focus {
            border-color: #666;
        }

        #search::placeholder {
            color: #777;
        }

        #store {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .app {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 20px;
        }

        .icon-container {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
        }

        .icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .app h2 {
            margin: 0 0 8px;
        }

        .app p {
            color: #aaa;
            min-height: 45px;
        }

        .button {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 8px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            margin-top: 8px;
        }

        .github {
            background: #242424;
            color: #fff;
        }

        .error,
        .loading,
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #aaa;
            padding: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Minzoi Store</h1>
        <p>Apps and tools made for Minzoi.</p>

        <input
            id="search"
            type="search"
            placeholder="Search apps and tools..."
            autocomplete="off"
        >
    </header>

    <main id="store">
        <div class="loading">Loading apps...</div>
    </main>

    <script>
        const store = document.getElementById("store");
        const search = document.getElementById("search");

        let apps = [];

        async function loadStore() {
            try {
                const response = await fetch("configs.json");

                if (!response.ok) {
                    throw new Error("Could not load configs.json");
                }

                const configFiles = await response.json();

                apps = [];

                for (const configFile of configFiles) {
                    try {
                        const configResponse = await fetch(configFile);

                        if (!configResponse.ok) {
                            throw new Error(
                                "Could not load " + configFile
                            );
                        }

                        const app = await configResponse.json();

                        apps.push(app);

                    } catch (error) {
                        console.error(error);
                    }
                }

                renderApps();

            } catch (error) {
                console.error(error);

                store.innerHTML =
                    '<div class="error">Could not load the store configuration.</div>';
            }
        }

        function renderApps() {
            const query = search.value.trim().toLowerCase();

            const filteredApps = apps.filter(app => {
                const name = (app.name || "").toLowerCase();
                const description = (app.description || "").toLowerCase();

                return (
                    name.includes(query) ||
                    description.includes(query)
                );
            });

            store.innerHTML = "";

            if (filteredApps.length === 0) {
                const result = document.createElement("div");

                result.className = "no-results";

                result.textContent = query
                    ? `No apps found for "${search.value}".`
                    : "No apps were found.";

                store.appendChild(result);

                return;
            }

            filteredApps.forEach(createApp);
        }

        function createApp(app) {
            const card = document.createElement("div");

            card.className = "app";

            const iconContainer = document.createElement("div");

            iconContainer.className = "icon-container";

            const icon = document.createElement("img");

            icon.className = "icon";
            icon.src = app.icon;
            icon.alt = `${app.name} icon`;

            iconContainer.appendChild(icon);

            const title = document.createElement("h2");

            title.textContent = app.name;

            const description = document.createElement("p");

            description.textContent = app.description;

            card.appendChild(iconContainer);
            card.appendChild(title);
            card.appendChild(description);

            if (app.downloadable === true && app.file) {

                const button = document.createElement("a");

                button.className = "button";
                button.href = app.file;
                button.textContent = "Download";
                button.download = "";

                card.appendChild(button);

            } else if (app.githuburl) {

                const button = document.createElement("a");

                button.className = "button github";
                button.href = app.githuburl;
                button.target = "_blank";
                button.rel = "noopener noreferrer";
                button.textContent = "GitHub";

                card.appendChild(button);
            }

            store.appendChild(card);
        }

        search.addEventListener("input", renderApps);

        loadStore();
    </script>

</body>
</html>
