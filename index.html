<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minzoi Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            padding: 40px 20px 30px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0 0 22px;
            color: #999;
        }

        #search {
            width: min(500px, 90%);
            padding: 13px 16px;

            border: 1px solid #333;
            border-radius: 10px;

            background: #181818;
            color: white;

            font-size: 16px;
            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #search:focus {
            border-color: #666;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        #search::placeholder {
            color: #666;
        }

        /* =========================
           STORE GRID
        ========================= */

        #store {
            max-width: 1100px;
            margin: auto;

            padding: 20px;

            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(130px, 1fr));

            gap: 25px;
        }

        /* =========================
           APP
        ========================= */

        .app {
            background: transparent;
            border: 0;

            padding: 10px;

            text-align: center;

            cursor: pointer;

            user-select: none;

            border-radius: 14px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .app:hover {
            transform: translateY(-4px);
            background: #181818;
        }

        .app:active {
            transform: scale(0.96);
        }

        .icon-container {
            width: 90px;
            height: 90px;

            margin: 0 auto 10px;
        }

        .icon {
            width: 100%;
            height: 100%;

            object-fit: contain;

            border-radius: 18px;

            display: block;
        }

        .app h2 {
            margin: 0;

            font-size: 15px;
            font-weight: 600;

            color: white;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =========================
           EMPTY / ERROR
        ========================= */

        .error,
        .loading,
        .no-results {
            grid-column: 1 / -1;

            text-align: center;

            color: #888;

            padding: 40px 20px;
        }

        /* =========================
           OVERLAY
        ========================= */

        #overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 90;
        }

        #overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* =========================
           SIDEBAR
        ========================= */

        #app-panel {
            position: fixed;

            top: 0;
            right: 0;

            width: min(420px, 90vw);
            height: 100vh;

            background: #151515;

            border-left: 1px solid #292929;

            padding: 30px;

            z-index: 100;

            overflow-y: auto;

            transform: translateX(100%);

            transition:
                transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #app-panel.active {
            transform: translateX(0);
        }

        /* =========================
           PANEL CLOSE
        ========================= */

        #close-panel {
            position: absolute;

            top: 18px;
            right: 18px;

            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 10px;

            background: #242424;
            color: white;

            font-size: 22px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        #close-panel:hover {
            background: #303030;
        }

        #close-panel:active {
            transform: scale(0.9);
        }

        /* =========================
           PANEL CONTENT
        ========================= */

        .panel-icon {
            width: 120px;
            height: 120px;

            object-fit: contain;

            border-radius: 24px;

            display: block;

            margin: 20px auto 25px;
        }

        #panel-name {
            margin: 0;

            text-align: center;

            font-size: 28px;
        }

        #panel-description {
            margin: 15px 0 30px;

            color: #aaa;

            line-height: 1.6;

            text-align: center;
        }

        /* =========================
           PANEL BUTTON
        ========================= */

        #panel-button {
            display: block;

            width: 100%;

            padding: 14px 18px;

            border-radius: 10px;

            background: white;
            color: black;

            text-align: center;

            text-decoration: none;

            font-weight: bold;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        #panel-button:hover {
            opacity: 0.9;
        }

        #panel-button:active {
            transform: scale(0.97);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding-top: 30px;
            }

            header h1 {
                font-size: 28px;
            }

            #store {
                grid-template-columns:
                    repeat(auto-fill, minmax(100px, 1fr));

                gap: 18px;

                padding: 15px;
            }

            .icon-container {
                width: 72px;
                height: 72px;

                margin-bottom: 8px;
            }

            .app h2 {
                font-size: 14px;
            }

            /* Bottom sheet */

            #app-panel {
                top: auto;
                bottom: 0;

                left: 0;
                right: 0;

                width: 100%;
                height: auto;

                max-height: 85vh;

                border-left: 0;
                border-top: 1px solid #292929;

                border-radius: 20px 20px 0 0;

                padding: 25px;

                transform: translateY(100%);
            }

            #app-panel.active {
                transform: translateY(0);
            }

            .panel-icon {
                width: 100px;
                height: 100px;

                margin-top: 10px;
            }

            #panel-name {
                font-size: 24px;
            }

            #panel-description {
                font-size: 15px;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Minzoi Store</h1>

        <p>
            Apps and tools made for Minzoi.
        </p>

        <input
            id="search"
            type="search"
            placeholder="Search apps and tools..."
            autocomplete="off"
        >
    </header>


    <main id="store">

        <div class="loading">
            Loading apps...
        </div>

    </main>


    <!-- Overlay -->

    <div id="overlay"></div>


    <!-- App panel -->

    <aside id="app-panel">

        <button id="close-panel" aria-label="Close">
            ×
        </button>

        <img
            id="panel-icon"
            class="panel-icon"
            src=""
            alt=""
        >

        <h2 id="panel-name"></h2>

        <p id="panel-description"></p>

        <a
            id="panel-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        ></a>

    </aside>


    <script>

        const store = document.getElementById("store");

        const search = document.getElementById("search");

        const overlay = document.getElementById("overlay");

        const panel = document.getElementById("app-panel");

        const closePanel = document.getElementById("close-panel");

        const panelIcon = document.getElementById("panel-icon");

        const panelName = document.getElementById("panel-name");

        const panelDescription =
            document.getElementById("panel-description");

        const panelButton =
            document.getElementById("panel-button");


        let apps = [];


        /* =========================
           LOAD STORE
        ========================= */

        async function loadStore() {

            try {

                const response =
                    await fetch("configs.json");

                if (!response.ok) {
                    throw new Error(
                        "Could not load configs.json"
                    );
                }

                const configFiles =
                    await response.json();


                apps = [];


                for (const configFile of configFiles) {

                    try {

                        const configResponse =
                            await fetch(configFile);

                        if (!configResponse.ok) {

                            throw new Error(
                                "Could not load " +
                                configFile
                            );

                        }


                        const app =
                            await configResponse.json();


                        apps.push(app);

                    } catch (error) {

                        console.error(error);

                    }

                }


                renderApps();

            } catch (error) {

                console.error(error);

                store.innerHTML =
                    '<div class="error">' +
                    'Could not load the store configuration.' +
                    '</div>';

            }

        }


        /* =========================
           RENDER APPS
        ========================= */

        function renderApps() {

            const query =
                search.value
                    .trim()
                    .toLowerCase();


            /*
             * ONLY SEARCH APP NAME
             */

            const filteredApps =
                apps.filter(app => {

                    const name =
                        (app.name || "")
                            .toLowerCase();

                    return name.includes(query);

                });


            store.innerHTML = "";


            if (filteredApps.length === 0) {

                const result =
                    document.createElement("div");

                result.className =
                    "no-results";


                result.textContent =
                    query
                        ? `No apps found for "${search.value}".`
                        : "No apps were found.";


                store.appendChild(result);

                return;

            }


            filteredApps.forEach(createApp);

        }


        /* =========================
           CREATE APP ICON
        ========================= */

        function createApp(app) {

            const card =
                document.createElement("div");

            card.className = "app";

            card.tabIndex = 0;


            const iconContainer =
                document.createElement("div");

            iconContainer.className =
                "icon-container";


            const icon =
                document.createElement("img");

            icon.className = "icon";

            icon.src = app.icon;

            icon.alt =
                `${app.name} icon`;


            iconContainer.appendChild(icon);


            const title =
                document.createElement("h2");

            title.textContent =
                app.name;


            card.appendChild(iconContainer);

            card.appendChild(title);


            /*
             * Open sidebar / bottom sheet
             */

            card.addEventListener(
                "click",
                () => openPanel(app)
            );


            card.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        openPanel(app);

                    }

                }
            );


            store.appendChild(card);

        }


        /* =========================
           OPEN PANEL
        ========================= */

        function openPanel(app) {

            panelIcon.src =
                app.icon || "";

            panelIcon.alt =
                `${app.name} icon`;


            panelName.textContent =
                app.name || "";


            panelDescription.textContent =
                app.description || "";


            /*
             * DOWNLOAD
             */

            if (
                app.downloadable === true &&
                app.file
            ) {

                panelButton.textContent =
                    "Download";

                panelButton.href =
                    app.file;

                panelButton.removeAttribute(
                    "target"
                );

            }

            /*
             * GITHUB
             */

            else if (app.githuburl) {

                panelButton.textContent =
                    "GitHub";

                panelButton.href =
                    app.githuburl;

                panelButton.target =
                    "_blank";

            }

            /*
             * No button
             */

            else {

                panelButton.textContent = "";

                panelButton.removeAttribute(
                    "href"
                );

                panelButton.style.display =
                    "none";

            }


            if (
                app.downloadable === true ||
                app.githuburl
            ) {

                panelButton.style.display =
                    "block";

            }


            overlay.classList.add("active");

            panel.classList.add("active");

            document.body.style.overflow =
                "hidden";

        }


        /* =========================
           CLOSE PANEL
        ========================= */

        function closeAppPanel() {

            overlay.classList.remove(
                "active"
            );

            panel.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }


        closePanel.addEventListener(
            "click",
            closeAppPanel
        );


        overlay.addEventListener(
            "click",
            closeAppPanel
        );


        /*
         * Escape key
         */

        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {

                    closeAppPanel();

                }

            }
        );


        /*
         * Search
         */

        search.addEventListener(
            "input",
            renderApps
        );


        /*
         * Start
         */

        loadStore();

    </script>

</body>
</html>
